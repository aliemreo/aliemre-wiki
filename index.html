<!-- Fonts are self-hosted from ./fonts (scripts/fonts.mjs); the boot script
     preloads the chosen set's latin faces. -->

<!-- Runs before first paint so the page never flashes the wrong theme.  The
     keys match src/lib/prefs.ts. -->
<script>
  (function () {
    var d = document.documentElement;
    d.classList.add('js');
    function get(k, fallback) { try { return localStorage.getItem(k) || fallback } catch (e) { return fallback } }
    d.setAttribute('data-theme', get('aeo-theme-v2', 'light'));
    d.setAttribute('data-palette', get('aeo-palette', 'amber'));
    d.setAttribute('data-bg', get('aeo-bg', 'scan'));
    var t = get('aeo-term', 'folded'); d.setAttribute('data-term', t === 'open' || t === 'wide' || t === 'full' || t === 'mini' ? t : 'folded');
    var tw = parseInt(get('aeo-term-w', ''), 10); if (tw > 0) d.style.setProperty('--term-w', tw + 'px');
    var th = parseInt(get('aeo-term-h', ''), 10); if (th > 0) { d.style.setProperty('--term-h', th + 'px'); d.setAttribute('data-term-h', ''); }
    var f = get('aeo-font', 'geist'); if (f !== 'inter') f = 'geist';
    d.setAttribute('data-font', f);
    [(f === 'inter' ? 'inter-tight' : 'geist') + '-latin', 'geist-mono-latin'].forEach(function (name) {
      var l = document.createElement('link'); l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2'; l.crossOrigin = 'anonymous'; l.href = './fonts/' + name + '.woff2'; document.head.appendChild(l);
    });
    var q = (location.search.match(/[?&]lang=(en|tr)/) || [])[1];
    d.lang = q || get('aeo-lang', (navigator.language || '').toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en');
  })()
</script>
