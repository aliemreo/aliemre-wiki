<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ali Emre Özcan</title>
<meta name="robots" content="noindex">
<!--
  GitHub Pages serves this for any path it does not recognise, and it sends the
  visitor to the real page with the last path segment as a hash:
  /aliemre-wiki/projects -> /aliemre-wiki/#projects.
  The redirect is relative, so it stays correct under the /<repo>/ base of a
  project site and at a domain root if a custom domain is attached later.
-->
<script>
  (function () {
    var seg = location.pathname.replace(/\/+$/, '').split('/').pop() || '';
    location.replace('./' + location.search + (seg ? '#' + encodeURIComponent(seg) : ''));
  })()
</script>
<p style="font-family:system-ui,sans-serif;padding:2rem">
  <a href="./">Ali Emre Özcan — go to the site</a>
</p>
