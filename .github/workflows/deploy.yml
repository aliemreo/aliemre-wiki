# Production deploy to GitHub Pages: https://aliemreo.github.io/aliemre-wiki/
#
# The deploy is gated — `needs: preflight` means a broken <noscript> mirror, a
# missing Turkish string or an un-bumped meta.updated never reaches the live
# site. Pull requests are covered separately by preflight.yml.
#
# One-time setup: repo Settings -> Pages -> Source = "GitHub Actions".
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false      # never interrupt a production deploy

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0         # the meta.updated rule diffs against the base commit
      - run: node .github/scripts/preflight.mjs
        env:
          PREFLIGHT_BASE: ${{ github.event.before }}

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deploy
        uses: actions/deploy-pages@v4
